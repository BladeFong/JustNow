AutoName: JustNow
Summary: Family task manager with a blooming flower reward system
Description: |
  A family-friendly task manager that turns task completion into a blooming
  garden. Children complete tasks, take achievement photos, and each photo
  becomes petals that light up weekly flowers. 5 flowers unlock a surprise.

  Key features:
  * Four-quadrant task organization
  * Photo achievement wall
  * Weekly flower reward system (petal → flower → surprise)
  * Multi-user support for family tablets
  * Student / teacher / professional schedule profiles
  * Holiday-aware time periods
  * Time period customization
  * Tag management and search
  * Adaptive phone/tablet layout
  * 100% offline, no account needed

